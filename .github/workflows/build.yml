name: Build

on:
  push:
    branches:
      - draft-release

concurrency: build

jobs:
  update-draft-release:
    name: Update draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag_name: ${{ steps.update-release-content.outputs.tag_name }}
    steps:
      - name: Update release content
        id: update-release-content
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitish: 'draft-release'

  cli:
    name: Build CLI
    needs: update-draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-cli.yml
    with:
      release-tag: ${{ needs.update-draft-release.outputs.tag_name }}
    secrets: inherit

  lambda:
    name: Build Lambda
    needs: update-draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-lambda.yml
    with:
      release-tag: ${{ needs.update-draft-release.outputs.tag_name }}
    secrets: inherit

  wasm:
    name: Build WebAssembly
    needs: update-draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-wasm.yml
    with:
      release-tag: ${{ needs.update-draft-release.outputs.tag_name }}
    secrets: inherit

  php-ext:
    name: Build PHP extension
    needs: update-draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-php-ext.yml
    with:
      release-tag: ${{ needs.update-draft-release.outputs.tag_name }}
    secrets: inherit

  jupyter:
    name: Build Jupyter Kernel
    needs: update-draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-jupyter.yml
    with:
      release-tag: ${{ needs.update-draft-release.outputs.tag_name }}
    secrets: inherit
