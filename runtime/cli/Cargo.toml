[package]
name = "cli"
version.workspace = true
authors.workspace = true
documentation.workspace = true
edition = "2024"

[[bin]]
name = "santa-cli"
path = "src/main.rs"

[dependencies]
atty = "0.2.14"
getopts = "0.2.21"
rustyline = "15.0.0"
lang = { path = "../../lang", version = "*", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tikv-jemallocator = "0.6.0"
ureq = "2.12.1"
url = "2.5.4"
pprof = { version = "0.14.0", features = ["flamegraph", "protobuf-codec"], optional = true }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.2"

[features]
profile = ["dep:pprof"]
